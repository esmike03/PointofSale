services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${POS_DB_DATABASE:-pos}
      MYSQL_USER: ${POS_DB_USERNAME:-pos}
      MYSQL_PASSWORD: ${POS_DB_PASSWORD:?Set POS_DB_PASSWORD in .env.deploy}
      MYSQL_ROOT_PASSWORD: ${POS_DB_ROOT_PASSWORD:?Set POS_DB_ROOT_PASSWORD in .env.deploy}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file: .env.deploy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${POS_DB_DATABASE:-pos}
      DB_USERNAME: ${POS_DB_USERNAME:-pos}
      DB_PASSWORD: ${POS_DB_PASSWORD:?Set POS_DB_PASSWORD in .env.deploy}
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - pos_storage:/var/www/html/storage/app

  nginx:
    build:
      context: ./server
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${POS_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mysql_data:
  pos_storage:
